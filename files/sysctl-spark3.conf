# System-wide VM settings inherited from MiaAI's Spark tuning.
# Qualified with this fork's reserve-aware profile on one GB10, 2026-09-07.
# Review deployment/README.md before applying or persisting these values.
# They affect every process, not just the inference container.
#
# GB10 shares CPU/GPU physical memory. Preserve a free-page floor and start
# reclaim earlier, rather than waiting for a burst of driver allocations.
# The larger watermarks materially lower reported MemAvailable for the same
# physical state. Do not compare our 4 GiB watchdog threshold or raw memory
# readings with a host using stock kernel watermarks.
#
# The measured profile pairs these values with HOST_RESERVE_GIB=36, a 90 GiB
# container cap, a 94 GiB startup admission gate, and the memory watchdog.
# These are not universal settings or a guarantee against driver exhaustion.
# Our bounded qualification observed no NVIDIA/OOM kernel errors or service
# restarts. It was not an overnight stability test.
#
# vm.min_free_kbytes is expressed in KiB: 4,194,304 KiB = 4 GiB.
vm.min_free_kbytes = 4194304
# 300 units of 1/10000 of memory = 3%; reclaim starts earlier.
vm.watermark_scale_factor = 300
# Use some configured swap for anonymous memory; swap is not GPU capacity.
vm.swappiness = 30
